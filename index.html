<html lang="ko">

    <meta name="theme-color" content="#f7f3ec" />
    <!-- 공유 미리보기 카드. 책 상세 주소(/book/…)는 api/share.ts가 그 책의 제목·표지로 바꿔 준다 -->
    <meta property="og:site_name" content="책있나" />

    <meta property="og:url" content="https://book-nearby.vercel.app/" />
    <!-- 카카오톡은 SVG를 못 읽고, 절대 주소여야 해서 PNG 전체 주소로 적는다 -->
    <meta property="og:image" content="https://book-nearby.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" /></noscript>
