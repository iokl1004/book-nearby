# 푸시·PR마다 자동 검사: 린트 → 단위 테스트 → 빌드 → 화면 클릭 테스트(E2E)
name: 검사

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # 러너에 설치된 Chrome을 쓴다 (playwright.config.ts의 channel: 'chrome'). API는 가짜 응답이라 키가 필요 없다
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
