# 데이터 자동 갱신: 매달 1일 오전 9시(한국 시간)에 공휴일을 다시 받아, 바뀐 게 있으면 커밋한다.
# 커밋이 올라가면 Vercel이 자동으로 다시 배포한다.
# 필요한 비밀값(저장소 Settings → Secrets and variables → Actions): DATA_GO_KR_KEY
#
# 인기 대출 도서(npm run sync:popular)는 여기서 하지 않는다.
# 정보나루(data4library.kr)가 해외 접속을 받지 않아, 미국에 있는 GitHub 서버에서는 접속 시간 초과로 실패했다.
# 한국에서(내 컴퓨터) 한 달에 한 번 손으로 실행한다.
name: 데이터 갱신

on:
  schedule:
    - cron: '0 0 1 * *' # UTC 1일 00:00 = 한국 시간 1일 오전 9시
  workflow_dispatch: # Actions 탭에서 손으로도 실행할 수 있게

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 공휴일 (특일 정보 2건 호출)
        run: npm run sync:holidays
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 바뀐 데이터 커밋
        run: |
          git add api/_data/holidays.json
          if git diff --cached --quiet; then echo "바뀐 데이터 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "데이터 자동 갱신: 공휴일 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
